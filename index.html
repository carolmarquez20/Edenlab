<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Edén Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one animated floating-islands sky behind everything. Home = Leito the lion on his island + three floating star/atom lab buttons. Each lab opens as a glass panel over the same sky. */
:root{
  --bg:#fbeaf6; --fg:#2a2150; --muted:#5a5185; --plate:#ffffff; --plate-t:rgba(255,255,255,.62); --glow:rgba(255,255,255,.95); --glow2:rgba(255,159,28,.55); --tut1:#bfe2ff; --tut2:#fbeaf6;
  --glass:rgba(255,255,255,.74); --glass-b:rgba(255,255,255,.94); --line:rgba(42,33,80,.2);
  --accent:#ff9f1c; --on-accent:#2a2150;
  --gold:#f5a623; --teal:#16a89b; --pink:#f0529c; --leaf:#4db85c; --sky:#3b82f6; --red:#e0483f; --orange:#f08a24;
  --ok:#1f8a4c; --bad:#c9443f;
  --silfill:#d7e7ff; --sil-line:#6aa5ff;
  --b-a:#f0529c; --b-t:#f5a623; --b-c:#4a8dff; --b-g:#3dbb5a;
  --lion-mane:#e0782a; --lion-body:#f4b24c; --lion-face:#ffd98f; --lion-belly:#ffe9b8;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120b33; --fg:#f6f1ff; --muted:#c3b9ef; --plate:#1d1250; --plate-t:rgba(29,18,80,.55); --glow:rgba(255,194,71,.6); --glow2:rgba(140,110,255,.6); --tut1:#1b0f50; --tut2:#43297a;
    --glass:rgba(26,16,70,.74); --glass-b:rgba(70,46,140,.9); --line:rgba(246,241,255,.26);
    --accent:#ffc247; --on-accent:#1b1140;
    --gold:#ffc247; --teal:#3ad6c6; --pink:#ff7db8; --leaf:#5fd17a; --sky:#6aa8ff; --red:#ff6a5f; --orange:#ffa040;
    --ok:#4cd987; --bad:#ff7a73;
    --silfill:#3b3f93; --sil-line:#8bb8ff;
    --b-a:#ff7db8; --b-t:#ffc247; --b-c:#6aa8ff; --b-g:#5fd17a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120b33; --fg:#f6f1ff; --muted:#c3b9ef; --plate:#1d1250; --plate-t:rgba(29,18,80,.55); --glow:rgba(255,194,71,.6); --glow2:rgba(140,110,255,.6); --tut1:#1b0f50; --tut2:#43297a;
  --glass:rgba(26,16,70,.74); --glass-b:rgba(70,46,140,.9); --line:rgba(246,241,255,.26);
  --accent:#ffc247; --on-accent:#1b1140;
  --gold:#ffc247; --teal:#3ad6c6; --pink:#ff7db8; --leaf:#5fd17a; --sky:#6aa8ff; --red:#ff6a5f; --orange:#ffa040;
  --ok:#4cd987; --bad:#ff7a73;
  --silfill:#3b3f93; --sil-line:#8bb8ff;
  --b-a:#ff7db8; --b-t:#ffc247; --b-c:#6aa8ff; --b-g:#5fd17a;
  color-scheme:dark;
}
/* Colorblind palette (Okabe-Ito based) */
:root[data-cb="1"]{
  --accent:#E69F00; --gold:#E69F00; --teal:#009E73; --pink:#CC79A7; --leaf:#009E73; --sky:#0072B2; --red:#D55E00; --orange:#E69F00;
  --ok:#0072B2; --bad:#D55E00; --sil-line:#0072B2;
  --b-a:#CC79A7; --b-t:#E69F00; --b-c:#0072B2; --b-g:#009E73;
  --lion-mane:#c9791c;
}
@media (prefers-color-scheme: dark){
  :root[data-cb="1"]:not([data-theme="light"]){
    --accent:#F0E442; --gold:#F0E442; --sky:#56B4E9; --ok:#56B4E9; --sil-line:#56B4E9; --b-c:#56B4E9; --teal:#2bc9a0; --leaf:#2bc9a0; --b-g:#2bc9a0; --on-accent:#1b1140;
  }
}
:root[data-cb="1"][data-theme="dark"]{
  --accent:#F0E442; --gold:#F0E442; --sky:#56B4E9; --ok:#56B4E9; --sil-line:#56B4E9; --b-c:#56B4E9; --teal:#2bc9a0; --leaf:#2bc9a0; --b-g:#2bc9a0; --on-accent:#1b1140;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:500 16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; min-height:100vh; overflow-x:hidden; position:relative;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:8px;max-width:1200px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid var(--glass-b);border-radius:26px;padding:8px 12px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font:800 1.5rem/1 var(--f-display);min-height:44px}
.logo svg{width:34px;height:34px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--glass-b);color:var(--fg);font:700 .95rem/1 var(--f-body);cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip svg{width:20px;height:20px;flex:none}
.lg{opacity:.62}
.lg.on{opacity:1;font-weight:800;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;background:var(--glass-b);padding:3px;gap:3px}
.seg button{width:42px;height:38px;border-radius:999px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg svg{width:22px;height:22px}
.counter{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:800 1.05rem var(--f-display)}
.counter svg{width:20px;height:20px}

.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding-block:16px 40px}
.view[hidden]{display:none}

/* home */
.hero{display:grid;gap:18px 32px;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:"lion copy" "lion labs" "lion note";align-items:start}
.hero-copy{grid-area:copy;display:grid;gap:10px;padding-top:12px}
.hero-copy p{font-size:1.1rem;max-width:34em;background:var(--glass);padding:10px 14px;border-radius:18px;backdrop-filter:blur(8px)}
.lion-stage{grid-area:lion;display:grid;gap:10px;justify-items:center;min-width:0}
.bubble{position:relative;background:var(--glass-b);border:3px solid var(--line);border-radius:22px;padding:12px 16px;max-width:30em;font-weight:700;min-height:4.2em;display:flex;align-items:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:var(--glass-b);border-right:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble.pop{animation:pop .35s ease-out}
.lion-btn{background:none;border:0;padding:0;cursor:pointer;width:min(300px,74vw);margin-top:6px}
.lion{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 10px 10px rgba(0,0,0,.18));animation:bob 3.6s ease-in-out infinite}
.lion-btn.hop .lion{animation:hop .6s ease-out}
.tail{transform-origin:138px 190px;animation:wag 1.8s ease-in-out infinite}
.eyes{transform-origin:100px 98px;animation:blink 4.6s infinite}
.o{display:none}
html[data-outfit="scientist"] .o-scientist,html[data-outfit="chef"] .o-chef,html[data-outfit="engineer"] .o-engineer,html[data-outfit="artist"] .o-artist,html[data-outfit="farmer"] .o-farmer,html[data-outfit="politician"] .o-politician{display:inline}
.island{width:min(380px,90%);margin-top:-52px;animation:float 5s ease-in-out infinite;pointer-events:none}
.wardrobe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(460px,100%)}
.wardrobe h2{grid-column:1/-1;font-size:1.15rem;font-weight:700;text-align:center}
.wardrobe .chip{flex-direction:column;gap:4px;padding:8px 6px;min-height:62px;font-size:.85rem;border-radius:20px}
.wardrobe .chip svg{width:26px;height:26px}
.labs-wrap{grid-area:labs;display:grid;gap:8px}
.labs-wrap h2{font-size:1.3rem;font-weight:700}
.labs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.labbtn{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;text-align:center;animation:float 4.4s ease-in-out infinite;animation-delay:var(--d,0s);min-width:0}
.labbtn .shape{width:min(128px,100%);aspect-ratio:1;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25));transition:transform .2s}
.labbtn:hover .shape,.labbtn:focus-visible .shape{transform:scale(1.12) rotate(-4deg)}
.labbtn .shape svg{width:100%;height:100%;overflow:visible}
.labbtn .cap{background:var(--glass-b);border:2px solid var(--line);border-radius:18px;padding:6px 8px;display:grid;gap:2px}
.labbtn b{font:800 1rem/1.1 var(--f-display)}
.labbtn small{font-size:.78rem;line-height:1.25;color:var(--muted);font-weight:600}
.spin{transform-origin:50px 50px;animation:spin 6s linear infinite}
.spin2{transform-origin:50px 50px;animation:spin 9s linear infinite reverse}
.note{grid-area:note;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font:800 .78rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.tag.sci{background:var(--sky);color:#fff}
.tag.faith{background:var(--gold);color:#2a2150}
:root[data-cb="1"] .tag.sci{background:var(--sky)}
.card{background:var(--glass);border:2px solid var(--glass-b);border-radius:22px;padding:12px 14px;display:grid;gap:6px;align-content:start;backdrop-filter:blur(8px)}
.card p{font-size:.95rem}

/* labs */
.labhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.labhead p{flex-basis:100%;background:var(--glass);padding:8px 14px;border-radius:16px;max-width:42em}
.lab-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.panel{background:var(--glass);border:2px solid var(--glass-b);border-radius:28px;padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;gap:12px;min-width:0}
.panel h3{font-size:1.35rem;font-weight:700}
canvas.lab{width:100%;border-radius:20px;display:block;background:#07031a}
#uniCv{height:clamp(260px,46vw,430px)}
#dnaCv{height:clamp(170px,30vw,230px)}
.caption{display:grid;gap:8px}
.caption h3{font-size:1.5rem}
.caption .row{display:grid;gap:6px;grid-template-columns:1fr 1fr}
.caption .row .card{background:var(--glass-b)}
.stagebar{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center}
.starbtn{position:relative;width:84px;border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:0;font:700 .75rem/1.15 var(--f-body)}
.starbtn svg{width:64px;height:64px;transition:transform .2s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.starbtn:hover svg{transform:scale(1.12) rotate(8deg)}
.starbtn .n{position:absolute;top:21px;left:0;right:0;font:800 1.4rem/1 var(--f-display);color:var(--on-accent)}
.starbtn[aria-pressed="false"] polygon{fill:var(--glass-b);stroke:var(--accent)}
.starbtn[aria-pressed="false"] .n{color:var(--fg)}
.starbtn[aria-pressed="true"] polygon{fill:var(--accent);stroke:var(--accent)}
.starbtn[aria-pressed="true"] svg{animation:pulse 1.6s ease-in-out infinite}
.starbtn span.l{max-width:84px;overflow-wrap:anywhere}
.guide{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center}
.guide .lion{animation:none;filter:none}
.guide .bubble{min-height:0;font-size:.95rem;padding:10px 12px;grid-column:2}
.guide .bubble::after{left:-9px;top:50%;bottom:auto;transform:translateY(-50%) rotate(135deg);width:14px;height:14px}
.guide .chip{grid-column:1/-1;justify-self:start;min-height:40px}
.atoms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px}
.atom{display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:6px 0 0;font:700 .78rem/1.1 var(--f-body);text-align:center;min-width:0}
.orb{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--glass-b);border:3px solid var(--accent);font:800 1.15rem var(--f-display);transition:transform .15s}
.orb::before,.orb::after{content:"";position:absolute;inset:-9px -3px;border:2px solid var(--line);border-radius:50%;transform:rotate(60deg)}
.orb::after{transform:rotate(-60deg)}
.atom:hover .orb{transform:scale(1.14)}
.cnt{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:var(--on-accent);font:800 .75rem/22px var(--f-body);font-style:normal;text-align:center;padding:0 4px;z-index:2}
.starprev{width:min(240px,70%);justify-self:center;aspect-ratio:1;display:block}
.rays{transform-origin:100px 100px;animation:spin 16s linear infinite}
.mixinfo{background:var(--glass-b);border-radius:18px;padding:10px 12px;font-size:.95rem;display:grid;gap:4px}
.mixrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* human */
.human-grid{display:grid;gap:16px;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);align-items:start}
#bodySvg{width:100%;max-height:560px;display:block;margin:0 auto}
.organ{cursor:pointer;outline:none}
.organ:focus-visible .main{stroke:var(--accent);stroke-width:5}
.organ .ring{fill:none;stroke:var(--accent);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.organ.sel{filter:drop-shadow(0 0 8px var(--accent))}
.organ.sel .ring{stroke-width:5}
.organ:hover .main{transform:scale(1.06)}
.organ .main{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.heart.beat .main{animation:beat .6s ease-out}
.bones{opacity:0;transition:opacity .3s;pointer-events:none}
.bones.show{opacity:1}
.info{display:grid;gap:10px}
.info h3{font-size:1.7rem}
.pulsebox{display:grid;gap:8px;background:var(--glass-b);border-radius:18px;padding:10px 12px}
.bigheart{justify-self:center;width:96px;height:96px;border-radius:50%;border:4px solid var(--accent);background:var(--glass);cursor:pointer;display:grid;place-items:center}
.bigheart svg{width:56px;height:56px}
.bigheart.beat svg{animation:beat .4s ease-out}
.comp{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.comp li{display:grid;grid-template-columns:38px minmax(70px,110px) minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:.9rem}
.comp .sym2{font:800 1.05rem var(--f-display);width:38px;height:38px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;background:var(--glass-b)}
.comp .bar2{height:14px;background:var(--glass-b);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.comp .bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px}
.comp b{text-align:right;font-variant-numeric:tabular-nums}

/* dna */
.strand{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rung{display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:16px;border:3px solid transparent;width:clamp(46px,12vw,64px)}
.rung.active{border-color:var(--accent);background:var(--glass-b)}
.rung .link{width:6px;height:14px;background:var(--line);border-radius:3px}
.base,.slot{width:100%;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font:800 1.4rem var(--f-display);color:var(--on-accent)}
:root:not([data-theme="dark"]) .base,:root:not([data-theme="dark"]) .slot{color:#1f1745}
.b-A{background:var(--b-a)}.b-T{background:var(--b-t)}.b-C{background:var(--b-c)}.b-G{background:var(--b-g)}
.slot{background:var(--glass-b);border:3px dashed var(--line);color:var(--muted)}
.slot.on{border-style:solid;border-color:transparent;animation:pop .35s ease-out}
.picks{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.basebtn{width:64px;height:64px;border-radius:50%;border:4px solid var(--glass-b);font:800 1.5rem var(--f-display);cursor:pointer;color:#1f1745;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .1s}
.basebtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.picks.shake{animation:shake .4s}
.msg{min-height:3em;text-align:center;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.msg svg{width:22px;height:22px;flex:none}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{background:var(--glass-b);border-radius:16px;padding:10px 12px;font-size:.95rem}
.foot{text-align:center;margin-top:28px;padding:12px;font-weight:700;background:var(--glass);border-radius:18px;backdrop-filter:blur(8px)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:30;background:var(--accent);color:var(--on-accent);font:800 1.05rem var(--f-display);padding:10px 18px;border-radius:99px;transition:all .35s;pointer-events:none;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{width:20px;height:20px}
.spark{position:fixed;z-index:40;width:14px;height:14px;pointer-events:none;background:var(--accent);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spark .9s ease-out forwards}

/* title plate: solid surface so the sky never competes with the title */
.plate{display:inline-block;justify-self:start;max-width:100%;position:relative;z-index:2;background:var(--plate-t);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--fg);padding:.1em .5em .16em;border-radius:24px;border:3px solid var(--glow);box-shadow:0 0 28px var(--glow2),0 0 60px var(--glow2);text-shadow:0 0 10px var(--glow),0 0 22px var(--glow),0 0 40px var(--glow2);font-weight:800;text-wrap:balance}
.hero-copy h1{font-size:clamp(2rem,6vw,3.5rem)}
.labhead h2{font-size:clamp(1.6rem,4.5vw,2.5rem)}
.chip .slash{display:none}
.chip[aria-pressed="false"] .slash{display:block}
.chip.playing{background:var(--accent);color:var(--on-accent);border-color:transparent}
.hide-s{display:inline}

/* leito cheer */
.cheer{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:flex-end;gap:8px;max-width:min(460px,calc(100vw - 32px))}
.cheer[hidden]{display:none}
.cheer.in{animation:cheerin .5s cubic-bezier(.2,1.4,.4,1)}
.cheer-lion{width:96px;flex:none}

/* ---------- helpers ---------- */
function applyI18n(){
  root.lang=lang;
  $$('[data-i18n]').forEach(function(e){e.textContent=t(e.dataset.i18n)});
  $$('[data-i18n-aria]').forEach(function(e){e.setAttribute('aria-label',t(e.dataset.i18nAria))});
  $$('.lg').forEach(function(e){e.classList.toggle('on',e.dataset.l===lang)});
  $('#counter').setAttribute('aria-label',t('stars.aria'));
  $('#toastTxt').textContent=t('toast');
  $('#langBtn').setAttribute('aria-label',lang==='es'?'Cambiar a English':'Switch to Español');
  updateAudioButtons();
}
function toast(){if(performance.now()-AU.lastOwn>500)sfx('star');var el=$('#toast');el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},1500)}
function burst(x,y){
  if(!motionOK)return;
  for(var i=0;i<10;i++){
    var s=document.createElement('span');s.className='spark';
    var a=Math.random()*6.283,r=40+Math.random()*70;
    s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');
    document.body.appendChild(s);setTimeout((function(n){return function(){n.remove()}})(s),950);
  }
}
function centerOf(el){var r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function discover(key){
  if(disc.indexOf(key)>=0)return false;
  disc.push(key);sset('eden.disc',disc);updateCount();toast();return true;
}
function updateCount(){$('#starCount').textContent=disc.length;checkMilestone()}
function refreshColors(){
  var cs=getComputedStyle(root);
  function g(n){return cs.getPropertyValue(n).trim()}
  COL={teal:g('--teal'),sky:g('--sky'),red:g('--red'),orange:g('--orange'),leaf:g('--leaf'),a:g('--b-a'),t:g('--b-t'),c:g('--b-c'),g:g('--b-g'),accent:g('--accent'),fg:g('--fg'),pink:g('--pink'),gold:g('--gold')};
}
function isNight(){return root.getAttribute('data-theme')==='dark'}

/* ---------- theme / cb / lang ---------- */
function setTheme(m){
  root.setAttribute('data-theme',m);sset('eden.theme',m);
  $('#dayBtn').setAttribute('aria-pressed',m==='light');$('#nightBtn').setAttribute('aria-pressed',m==='dark');
  refreshColors();redraw();
}
function setCB(on){
  root.setAttribute('data-cb',on?'1':'0');sset('eden.cb',on);
  $('#cbBtn').setAttribute('aria-pressed',on?'true':'false');
  refreshColors();renderAll();redraw();
}
function setLang(l){lang=l;sset('eden.lang',l);applyI18n();renderAll()}

function fit(cv){
  var w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h)return null;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr}
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  return {c:c,w:w,h:h};
}
function dot(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832);c.fill()}
function drawGalaxy(c,x,y,s,rot,al){
  var g=c.createRadialGradient(x,y,0,x,y,s*.4);g.addColorStop(0,'rgba(255,240,200,'+(.9*al)+')');g.addColorStop(1,'rgba(255,200,120,0)');
  c.fillStyle=g;dot(c,x,y,s*.4);
  for(var i=0;i<gal.length;i++){
    var q=gal[i],a=q.a+rot,rr=q.d*s;
    c.fillStyle='hsla('+(215-45*(1-q.d))+',90%,78%,'+((.3+.55*(1-q.d))*al)+')';
    dot(c,x+Math.cos(a)*rr,y+Math.sin(a)*rr*.55,q.r*(s>120?1:.7));
  }
}
function drawUni(ts){

  var p=Math.min(1,Math.max(0,(ts-uni.t0)/5000)),e=1-Math.pow(1-p,3),i,q;
  c.fillStyle='#07031a';c.fillRect(0,0,w,h);
  var bg=c.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.7);bg.addColorStop(0,'#1b0f45');bg.addColorStop(1,'#07031a');c.fillStyle=bg;c.fillRect(0,0,w,h);
  if(st>=3){
    for(i=0;i<ustars.length;i++){q=ustars[i];c.fillStyle='rgba(255,255,255,'+(.35+.55*Math.abs(Math.sin(tt*1.2+q.p)))+')';dot(c,q.x*w,q.y*h,q.r)}
  }
  if(st===0){
    c.fillStyle='rgba(255,255,255,.9)';dot(c,cx,cy,2.5+Math.sin(tt*2)*1.2);
    c.strokeStyle='rgba(255,255,255,.25)';c.beginPath();c.arc(cx,cy,10+Math.sin(tt*2)*3,0,6.2832);c.stroke();
  }else if(st===1){
    var rad=R*(.06+.8*e),g=c.createRadialGradient(cx,cy,0,cx,cy,rad);
    g.addColorStop(0,'rgba(255,255,255,'+(1-.45*e)+')');g.addColorStop(.35,'rgba(255,200,90,'+(.85-.5*e)+')');g.addColorStop(1,'rgba(255,90,40,0)');
    c.fillStyle=g;dot(c,cx,cy,rad);
    for(i=0;i<bb.length;i++){q=bb[i];var dd=q.v*e*R*.72*(1+Math.sin(tt+q.a)*.012);c.fillStyle='hsla('+(35+q.h*25)+',100%,'+(70+q.h*20)+'%,'+(.9-.4*e)+')';dot(c,cx+Math.cos(q.a)*dd,cy+Math.sin(q.a)*dd,q.r)}
  }else if(st===2){
    for(i=0;i<gas.length;i++){var b=gas[i],x=(b.x+Math.sin(tt*.15+b.p)*.03)*w,y=(b.y+Math.cos(tt*.12+b.p)*.03)*h,r=b.r*R*1.6;
      var gg=c.createRadialGradient(x,y,0,x,y,r);gg.addColorStop(0,'rgba('+b.h+',.4)');gg.addColorStop(1,'rgba('+b.h+',0)');c.fillStyle=gg;dot(c,x,y,r)}

    for(i=0;i<bb.length;i++){q=bb[i];var b2=gas[i%gas.length];
      dot(c,(b2.x+Math.sin(tt*.15+b2.p)*.03)*w+Math.cos(q.a)*q.v*b2.r*R*.9,(b2.y+Math.cos(tt*.12+b2.p)*.03)*h+Math.sin(q.a)*q.v*b2.r*R*.9,q.r*.6)}
  }else if(st===3){
    drawGalaxy(c,cx,cy,R*.38,tt*.06,1);drawGalaxy(c,w*.15,h*.25,R*.1,-tt*.08,.8);drawGalaxy(c,w*.87,h*.75,R*.12,tt*.07,.8);
  }else{
    var sg=c.createRadialGradient(cx,cy,0,cx,cy,R*.16);sg.addColorStop(0,'rgba(255,240,150,1)');sg.addColorStop(.4,'rgba(255,190,60,.55)');sg.addColorStop(1,'rgba(255,150,40,0)');
    c.fillStyle=sg;dot(c,cx,cy,R*.16);c.fillStyle='#ffd45c';dot(c,cx,cy,R*.045);
    for(i=0;i<PLANETS.length;i++){
      var pl=PLANETS[i],ro=R*pl.r*.85,an=tt*pl.sp*.4+i*1.7;
      c.strokeStyle='rgba(255,255,255,.14)';c.lineWidth=1;c.beginPath();c.arc(cx,cy,ro,0,6.2832);c.stroke();

        c.strokeStyle='rgba(255,255,255,'+(.45+.3*Math.sin(tt*3))+')';c.lineWidth=2;c.beginPath();c.arc(px,py,pl.s+6+Math.sin(tt*3)*2,0,6.2832);c.stroke();

        c.fillStyle='#5bd17a';dot(c,px-1.5,py-1,2.4);
      }
    }
  }
}

function drawMus(ts){
  var f=fit($('#musCv'));if(!f)return;
  var c=f.c,w=f.w,h=f.h,tt=ts/1000,cy=h/2,i,x,live=false,now=performance.now();
  var bg=c.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#1d1050');bg.addColorStop(1,'#07031a');c.fillStyle=bg;c.fillRect(0,0,w,h);
  c.fillStyle='rgba(255,255,255,.45)';
  for(i=0;i<40;i++)dot(c,((i*97)%100)/100*w,((i*53)%100)/100*h,1+(i%3)*.5);
  if(AU.an&&AU.ctx&&AU.ctx.state==='running'){AU.an.getByteTimeDomainData(AU.wave);live=true}
  var n=AU.wave?AU.wave.length:1;
  for(var pass=0;pass<2;pass++){
    c.strokeStyle=pass?'rgba(255,255,255,.35)':COL.accent;c.lineWidth=pass?2:5;c.lineCap='round';c.lineJoin='round';c.beginPath();
    for(x=0;x<=w;x+=3){

  ripples=ripples.filter(function(r){return now-r.t<1400});
  for(i=0;i<ripples.length;i++){
    var r=ripples[i],age=(now-r.t)/1400,rx=40+((r.m-58)/26)*(w-80);

    c.globalAlpha=1;
  }

function renderTut(){
  var i=tut.i,last=i===TN-1,vis='',o;
  $('#tutTitle').textContent=t('tut'+(i+1)+'.h');
  $('#tutText').textContent=t('tut'+(i+1)+'.t');
  if(i===1){
    vis='<div class="t-labs">'+LABS.map(function(l){return '<div class="t-lab"><span class="t-ico">'+l.sh+'</span><b>'+t(l.k+'.name')+'</b></div>'}).join('')+'</div>';
  }else if(i===2){
    vis='<span class="t-ico"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="'+starPts(5,45,20)+'" fill="var(--gold)" stroke="var(--gold)" stroke-width="7" stroke-linejoin="round"/></svg></span><span class="orb">H</span><span class="t-ico">'+HEARTSVG+'</span><span class="t-ico"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="'+starPts(8,46,30)+'" fill="var(--teal)" stroke="var(--teal)" stroke-width="7" stroke-linejoin="round"/></svg></span>';
  }else if(i===3){
    vis=OUTFITS.map(function(k){return '<span class="chip fake">'+OICON[k]+'<span>'+t('o.'+k)+'</span></span>'}).join('');
  }else if(i===4){
    vis='<span class="chip fake"><span class="lg on">English</span>/<span class="lg">Español</span></span>'
      +'<span class="chip fake">'+svgOf('#musicBtn')+'<span>'+t('music')+'</span></span>'
      +'<span class="chip fake">'+svgOf('#sfxBtn')+'<span>'+t('sfx')+'</span></span>'
      +'<span class="chip fake">'+svgOf('#dayBtn')+svgOf('#nightBtn')+'<span>'+t('tut.dn')+'</span></span>';
  }else if(i===5){
    var on=root.getAttribute('data-cb')==='1';
    vis='<button class="chip" id="tutCb" type="button" aria-pressed="'+on+'">'+svgOf('#cbBtn')+'<span>'+t('tut.cb')+'</span></button>';
  }
  $('#tutVis').innerHTML=vis;
  $('#tutDots').innerHTML=Array.apply(null,Array(TN)).map(function(_,k){return '<i'+(k===i?' class="on"':'')+'></i>'}).join('');
  $('#tutNext').textContent=t(last?'tut.go':'tut.next');
  $('#tutSkip').hidden=last;
  $('#tutLion').classList.toggle('big',i===0||last);
}
function tutHop(){
  var l=$('#tutLion');l.classList.remove('hop');void l.offsetWidth;l.classList.add('hop');
}
function openTut(){
  tut.on=true;tut.i=0;
  hideCheer();
  $('#tutLion').innerHTML=lionSVG();
  $('#tut').hidden=false;$('#tut').scrollTop=0;
  root.classList.add('tut-open');
  ['.top','.wrap'].forEach(function(s){var e=$(s);if(e)e.inert=true});
  renderTut();tutHop();
  var n=$('#tutNext');if(n)n.focus({preventScroll:true});
}
function closeTut(){
  tut.on=false;sset('eden.tutorial',true);
  $('#tut').hidden=true;root.classList.remove('tut-open');
  ['.top','.wrap'].forEach(function(s){var e=$(s);if(e)e.inert=false});
  window.scrollTo(0,0);
}
function handleTutClick(el){
  if(el.id==='tutNext'){
    if(tut.i<TN-1){tut.i++;renderTut();tutHop();$('#tut').scrollTop=0}else closeTut();
    return true;
  }
  if(el.id==='tutSkip'){closeTut();return true}
  if(el.id==='tutLang'){setLang(lang==='es'?'en':'es');return true}
  if(el.id==='tutCb'){setCB(el.getAttribute('aria-pressed')!=='true');return true}
  if(el.id==='tutBtn'||el.id==='tutBtn2'){openTut();return true}
  return false;
}
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&tut.on)closeTut()});
function initTutorial(){
  if(!isMobile())return;
  root.setAttribute('data-mobile','1');
  if(!sget('eden.tutorial',false))openTut();
}

/* ---------- own sounds duck the background music ---------- */
function thump(t,vol){
  var d=AU.sfx,o=osc('sine',95);
  o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);
  voice(o,d,t,vol,.005,0,.16);
  var o2=osc('triangle',190);o2.frequency.setValueAtTime(190,t);o2.frequency.exponentialRampToValueAtTime(95,t+.1);
  voice(o2,d,t,vol*.35,.004,0,.09);
}
function musicTarget(){return AU.musicOn&&(cur!=='musica'||AU.labMusic)&&performance.now()>=AU.duckUntil?.3:0}
function applyMusicGain(){
  var c=AU.ctx;if(!c||!AU.music)return;
  AU.music.gain.cancelScheduledValues(c.currentTime);
  AU.music.gain.setTargetAtTime(musicTarget(),c.currentTime,.25);
}
function duckMusic(){
  AU.duckUntil=performance.now()+9000;applyMusicGain();
  clearTimeout(AU.duckT);AU.duckT=setTimeout(applyMusicGain,9100);
}
function ownSound(kind,arg){
  AU.lastOwn=performance.now();
  if(AU.sfxOn)duckMusic();
  sfx(kind,arg);
}

/* ---------- v2 features ---------- */
var ACT={dancer:'dance',footballer:'kick',singer:'sing',scientist:'tilt',chef:'nod',artist:'dance',farmer:'tilt',teacher:'nod',politician:'sing',vet:'nod'};
var ALLC=['purr','hop2','yawning','smiling','a-dance','a-kick','a-sing','a-tilt','a-nod'];
function actLion(kind){
  var L=$$('.lion-btn .lion');if(!L.length)return;
  L.forEach(function(l){ALLC.forEach(function(c){l.classList.remove(c)})});
  void document.body.offsetWidth;
  kind=kind||['purr','yawn','hop','act'][Math.floor(Math.random()*4)];
  var cl=kind==='purr'?'purr':kind==='yawn'?'yawning':kind==='hop'?'hop2':'a-'+ACT[outfit];
  L.forEach(function(l){l.classList.add(cl);setTimeout(function(){ALLC.forEach(function(c){l.classList.remove(c)})},kind==='yawn'?3200:3000)});
  if(kind==='purr'){say(t('say.purr'));sfx('purr')}
  else if(kind==='yawn'){say(t('say.yawn'));sfx('yawn');setTimeout(function(){L.forEach(function(l){l.classList.remove('yawning');l.classList.add('smiling')})},1500)}
  else if(kind==='hop'){var ch=d().chat;say(ch[Math.floor(Math.random()*ch.length)])}
  else{sayOutfit();sfx('star')}
}
var FABK={universo:'uni',cocina:'uni',humano:'hum',adn:'adn',musica:'mus'},fabOpen=false,fabWel=true;
function renderFab(){var f=$('#fab'),k=FABK[cur];if(!f)return;if(!k){f.hidden=true;return}f.hidden=false;f.innerHTML=(fabOpen?'<div class="bubble fabwin">'+(fabWel?t('lead'):d().tips[k][tipIdx[k]%3])+'</div>':'')+'<div class="fabrow">'+lionSVG()+'<button class="chip" type="button" id="fabBtn">'+t('another')+'</button></div>'}
var sfSel='sci';
function renderSF(){
  $$('#sfTabs .chip').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.sf===sfSel?'true':'false')});
  var e=$('#sfBody');if(e)e.innerHTML='<p>'+t(sfSel==='sci'?'mus.sci':'mus.faith')+'</p>';
}
var B={on:false,sel:null,hint:null,placed:{}},bmsg='',SLOT={brain:[150,74],eyes:[150,111],lungs:[150,205],heart:[150,222],bones:[150,320]};
function renderBuild(){
  var ks=Object.keys(SLOT),left=ks.filter(function(k){return !B.placed[k]});
  $('#buildBtn').textContent=t(B.on?'build.exit':'build');
  $('#slots').innerHTML=B.on?left.map(function(k){return '<circle class="slot2'+(B.hint===k?' hint':'')+'" data-slot="'+k+'" cx="'+SLOT[k][0]+'" cy="'+SLOT[k][1]+'" r="'+(k==='bones'?24:20)+'"/>'}).join(''):'';
  ks.forEach(function(k){var g=$('#o-'+k),ok=!B.on||B.placed[k];g.style.opacity=ok?1:0;g.style.pointerEvents=ok?'':'none'});
  $('#tray').innerHTML=B.on?left.map(function(k){return '<button class="chip" type="button" data-nosfx data-tok="'+k+'" aria-pressed="'+(B.sel===k)+'">'+d().org[k].n+'</button>'}).join(''):'';
  $('#buildMsg').textContent=bmsg;
}
$('#bodySvg').addEventListener('click',function(ev){
  var sl=ev.target.closest('[data-slot]');if(!sl||!B.on)return;
  if(!B.sel){bmsg=t('build.pick')}
  else if(B.sel===sl.dataset.slot){
    B.placed[B.sel]=1;discover('b:'+B.sel);B.hint=null;B.sel=null;sfx('ok');bmsg=t('build.ok');
    if(Object.keys(B.placed).length===5){bmsg=t('build.done');discover('b:all');var c=centerOf($('#bodySvg'));burst(c[0],c[1])}
  }else{B.hint=B.sel;sfx('no');bmsg=t('build.no')}
  renderBuild();
});
$('#compWin').addEventListener('click',function(e){if(e.target.id==='compWin')this.hidden=true});
addEventListener('hashchange',function(){$('#compWin').hidden=true});
function setVH(){
  var rot=matchMedia('(orientation:portrait)').matches&&innerWidth<=820&&matchMedia('(pointer:coarse)').matches,h=rot?innerWidth:innerHeight;
  root.style.setProperty('--vh',h+'px');root.classList.toggle('short',h<=600);
}
setVH();addEventListener('resize',setVH);addEventListener('orientationchange',setVH);
function initMobileMenu(){
  if(!root.hasAttribute('data-mobile'))return;
  var w=document.createElement('div');w.id='setWin';w.hidden=true;
  ['langBtn','cbBtn','musicBtn','sfxBtn'].forEach(function(id){w.appendChild($('#'+id))});
  w.appendChild($('.seg'));document.body.appendChild(w);
  document.addEventListener('click',function(e){if(!w.hidden&&!e.target.closest('#setWin,#setBtn'))w.hidden=true});
  addEventListener('hashchange',function(){w.hidden=true});mobPlace();
}
function mobPlace(){
  var w=$('#setWin');if(!w)return;var ctl=$('.ctl'),lab=cur!=='home',g=function(i){return $(i)};
  if(lab){
    [g('#homeBtn'),g('#counter'),g('#setBtn')].forEach(function(e){ctl.appendChild(e)});
    [g('#langBtn'),g('#cbBtn'),g('#musicBtn'),g('#sfxBtn'),g('#tutBtn'),g('.seg')].forEach(function(e){w.appendChild(e)});
  }else{
    w.hidden=true;
    [g('#homeBtn'),g('#counter'),g('#langBtn'),g('#cbBtn'),g('#musicBtn'),g('#sfxBtn'),g('#tutBtn'),g('.seg'),g('#setBtn')].forEach(function(e){ctl.appendChild(e)});
  }
}
/* ---------- loop ---------- */
function frame(ts){drawSky(ts);if(cur==='universo')drawUni(ts);else if(cur==='adn')drawDNA(ts);else if(cur==='musica')drawMus(ts)}
function loop(ts){frame(ts);requestAnimationFrame(loop)}
function redraw(){if(!motionOK)frame(performance.now())}

/* ---------- routing ---------- */
function route(){
  var h=location.hash.replace('#','');
  cur=['universo','humano','adn','musica','cocina','personalizar'].indexOf(h)>=0?h:'home';
  if(cur!=='musica')stopSeq();
  if(cur==='musica')AU.labMusic=false;
  setMood({universo:'space',cocina:'space',humano:'body',adn:'dna'}[cur]||'eden');document.body.classList.toggle('lab',cur!=='home');fabOpen=false;fabWel=true;renderFab();mobPlace();
  applyMusicGain();updateAudioButtons();
  $$('.view').forEach(function(e){e.hidden=e.id!=='v-'+cur});
  window.scrollTo(0,0);
  if(cur==='universo'&&uni.stage===0)uni.t0=performance.now();
  redraw();
  if(!motionOK)setTimeout(redraw,60);
}

function renderAll(){
  renderHome();renderGuides();renderStages();renderMixer();renderComp();renderOrgan();renderDNA();renderMusic();renderBuild();renderSF();renderFab();applyI18n();if(tut.on)renderTut();
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('button,a');if(!el)return;
  if(handleTutClick(el))return;
  if(handleMusicClick(el))return;
  if(el.id==='langBtn'){setLang(lang==='es'?'en':'es');return}
  if(el.id==='cbBtn'){setCB(el.getAttribute('aria-pressed')!=='true');return}
  if(el.id==='dayBtn'){setTheme('light');return}
  if(el.id==='nightBtn'){setTheme('dark');return}
  if(el.classList.contains('lion-btn')){actLion();return}
  if(el.id==='fabBtn'){var fk=FABK[cur];if(fabOpen){if(fabWel)fabWel=false;else tipIdx[fk]++}fabOpen=true;renderFab();return}
  if(el.id==='setBtn'){var sw=$('#setWin');if(sw)sw.hidden=!sw.hidden;return}
  if(el.id==='compBtn'){$('#compWin').hidden=false;discover('c:comp');return}
  if(el.id==='compX'){$('#compWin').hidden=true;return}
  if(el.id==='buildBtn'){B.on=!B.on;B.sel=null;B.hint=null;B.placed={};bmsg=B.on?t('build.pick'):'';renderBuild();return}
  if(el.dataset.tok){B.sel=el.dataset.tok;renderBuild();return}
  if(el.dataset.o&&el.closest('#wardrobe')){setOutfit(el.dataset.o);return}
  if(el.dataset.s){ownSound('starN',+el.dataset.s);setStage(+el.dataset.s);var c=centerOf(el);burst(c[0],c[1]);return}
  if(el.dataset.el){var k=el.dataset.el;mix[k]=(mix[k]||0)+1;lastEl=k;discover('e:'+k);sfx('atom',EL.indexOf(k));renderMixer();var c2=centerOf(el);burst(c2[0],c2[1]);return}
  if(el.id==='mixClear'){mix={};lastEl=null;renderMixer();return}
  if(el.dataset.tip){var tk=el.dataset.tip;tipIdx[tk]++;renderGuides();return}
  if(el.id==='pulseGo'){startPulse();return}
  if(el.id==='tapHeart'){ownSound('heart');pulse.taps++;var te=$('#pTaps');if(te)te.textContent=pulse.taps;el.classList.remove('beat');void el.offsetWidth;el.classList.add('beat');return}
  if(el.dataset.b){answer(el.dataset.b,el);return}
  if(el.id==='newStrand'){newStrand();renderDNA();redraw();return}
});
$$('.organ').forEach(function(g){
  g.addEventListener('click',function(){pickOrgan(g.dataset.o)});
  g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pickOrgan(g.dataset.o)}});
});
addEventListener('hashchange',route);
addEventListener('resize',redraw);

/* ---------- init ---------- */
$$('.lion-btn .lion-slot').forEach(function(e){e.innerHTML=lionSVG()});
$('#ctrStar').setAttribute('points',starPts(5,46,20));
$('#toastStar').setAttribute('points',starPts(5,46,20));
var storedTheme=sget('eden.theme',null);
var startTheme=storedTheme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
root.setAttribute('data-outfit',outfit);
root.setAttribute('data-cb',sget('eden.cb',false)?'1':'0');
$('#cbBtn').setAttribute('aria-pressed',sget('eden.cb',false)?'true':'false');
root.setAttribute('data-theme',startTheme);
$('#dayBtn').setAttribute('aria-pressed',startTheme==='light');$('#nightBtn').setAttribute('aria-pressed',startTheme==='dark');
refreshColors();
newStrand();
updateCount();
renderAll();
initAudioUnlock();
updateAudioButtons();
route();
initTutorial();initMobileMenu();
if(motionOK)requestAnimationFrame(loop);else redraw();
})();
</script>
